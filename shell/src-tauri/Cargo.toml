[package]
name = "murmur-shell"
version = "1.4.3"
description = "Murmur for Windows and Linux: dictation, the tray icon, the hotkey and the search panel, over Murmur's helper"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-autostart = "2.5.1"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
tauri-plugin-updater = "2.13.3"
# Dictation: the microphone, and Parakeet through sherpa-onnx (its static library, ONNX Runtime inside: nothing more to
# install beside Murmur.exe).
cpal = "0.18.2"
sherpa-onnx = "=1.13.8"
# Commands & AI: Ollama, Claude and OpenAI over HTTPS (the updater's reqwest and rustls, with Windows' own certificate
# store and proxy settings), and the quick commands' patterns (some look ahead, which `regex` can't).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
regex = "1"
fancy-regex = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A job object that ends the helpers with the shell, the taskbar's theme for the tray icon, and the local time for set
# hours (already in Tauri's build on Windows).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
                                              "Win32_System_Registry", "Win32_System_SystemInformation",
                                              "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory",
                                              # dictation: the key, the paste, the pill that never takes the focus
                                              "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
                                              "Win32_System_LibraryLoader", "Win32_Graphics_Dwm",
                                              # dictation: the key watcher's thread priority
                                              "Win32_System_Threading",
                                              # Commands & AI: the API keys in the Credential Manager, locking the PC
                                              "Win32_Security_Credentials", "Win32_System_Shutdown"] }
# dictation: the text around the cursor (UI Automation) and Windows' spell checker, which are COM (dictation/cursor.rs);
# commands: the speakers' volume (commands/actions.rs); search: Windows' OCR for pictures' text (ocr.rs)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility",
                                          "Win32_Globalization", "Win32_UI_WindowsAndMessaging",
                                          "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
                                          "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
                                          # search: text in screenshots and photos, with Windows' own OCR (ocr.rs)
                                          "Win32_System_WinRT", "Foundation", "Foundation_Collections",
                                          "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams"] }

# GNOME's shortcut settings, `--toggle` handed to the running Murmur, and the panel's window on Wayland (all already in
# Tauri's build on Linux).
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
zbus = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Dragging a result out of the window: the system's drag on Windows and the Mac (on Linux, WebKit's own drag does it).
[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = "2.1.1"
